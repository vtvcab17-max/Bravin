<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bravin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@1,700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/theme.css">

<div id="ghost" aria-hidden="true"><div class="ring"></div><svg viewBox="0 0 24 24"><path d="M4 2l15 9-7 1.6L9 20z" fill="#fff" stroke="#0d1417" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="tag">Claude</span></div>
<div class="app">
  <header class="top">
    <div class="brand"><svg class="i bmark" viewBox="0 0 100 100" aria-hidden="true"><g fill="var(--accent)"><rect x="18" y="14" width="13" height="72" rx="5"/><rect x="35" y="14" width="38" height="20" rx="10"/><rect x="35" y="40" width="31" height="20" rx="10"/><rect x="35" y="66" width="46" height="20" rx="10"/></g><rect x="55.5" y="8" width="4" height="84" rx="2" fill="var(--gold)"/><path d="M51 6H64L57.5 13Z" fill="var(--gold)"/></svg><span>Bravin</span></div>
    <span class="badge" id="projBadge">Đang tải dự án…</span>
    <div class="spacer"></div>
    <label class="tc" for="aspect">Khung hình</label>
    <select id="aspect">
      <option value="9:16">9:16 · TikTok/Reels</option>
      <option value="16:9">16:9 · YouTube</option>
      <option value="1:1">1:1 · Vuông</option>
      <option value="4:5">4:5 · Instagram</option>
    </select>
    <button id="saveProj" title="Dự án tự lưu trên máy. Nút này xuất file .json để chuyển máy hoặc gửi cho Claude"><svg class="i" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg>Xuất .json</button>
    <button id="openProj" title="Nhập file dự án .json thành dự án mới"><svg class="i" viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg>Mở dự án</button>
    <input type="file" id="projFile" accept=".json,application/json" hidden>
    <button id="newProj" title="Xoá timeline, bắt đầu dự án trống"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Dự án mới</button>
    <button class="icon" id="moreBtn" title="Thêm" aria-label="Thêm tuỳ chọn"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
    <button class="primary" id="exportBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Xuất video</button>
  </header>

  <div class="main">
    <section class="panel" id="libPanel" aria-label="Thư viện">
      <div class="ph"><span>Thư viện</span><span class="phbtns"><button class="icon" id="dlBtn" title="Dán link để tải video về"><svg class="i" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button><button class="icon" id="importBtn" title="Nhập file"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></span></div>
      <div class="bin" id="bin">
        <div class="drop" id="drop">Thả video, ảnh hoặc nhạc vào đây<br><small>Kéo clip đè lên một đoạn trên timeline để thay thế</small></div>
        <button type="button" class="dllink" id="dropLink">🔗 Dán link để tải về</button>
      </div>
      <input type="file" id="file" accept="video/*,audio/*,image/*" multiple hidden>
    </section>

    <section class="stage" aria-label="Xem trước">
      <div class="canvaswrap"><canvas id="pv" width="720" height="1280"></canvas></div>
      <div class="transport">
        <button class="icon" id="toStart" title="Về đầu (Home)"><svg class="i" viewBox="0 0 24 24"><path d="M6 5v14M18 6l-8 6 8 6z"/></svg></button>
        <button class="icon" id="stepBack" title="Lùi 1 khung (←)"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="primary" id="playBtn" title="Phát / dừng (Space)"><svg class="i" viewBox="0 0 24 24" id="playIco"><path d="M7 5l12 7-12 7z"/></svg><span id="playTxt">Phát</span></button>
        <button class="icon" id="stepFwd" title="Tiến 1 khung (→)"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <span class="tc" id="tc"><b>00:00.00</b> / 00:00.00</span>
      </div>
    </section>

    <section class="panel" id="sidePanel" aria-label="Trợ lý và thuộc tính">
      <div class="ph"><div class="tabs" role="tablist">
        <button role="tab" id="tabAi" aria-selected="true" aria-controls="aiPane"><span class="dot"></span> Trợ lý</button>
        <button role="tab" id="tabInsp" aria-selected="false" aria-controls="insp">Thuộc tính</button>
      </div><span class="tc" style="font-size:10.5px" id="aiBadge">Chưa kết nối</span></div>
      <div class="ai" id="aiPane" role="tabpanel">
        <div class="aibar">
          <label for="aiMode" class="tc" style="font-size:11px">Dùng</label>
          <select id="aiMode"><option value="builtin">Claude Opus 5.5 (claude.ai)</option><option value="api">Chuỗi AI qua API</option><option value="local">Chuỗi AI local</option></select>
          <button id="aiCfgBtn" title="Cài đặt AI qua API và AI local"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Cài đặt AI</button>
        </div>
        <div class="chainline" id="chainLine" hidden></div>
        <div class="aicfg" id="aiCfg" hidden></div>
        <div class="msgs" id="msgs" aria-live="polite"></div>
        <div class="chips" id="chips">
          <button>Thêm chữ tiêu đề màu vàng ở 3 giây đầu</button>
          <button>Thêm chuyển cảnh Hoà tan cho mọi điểm cắt</button>
          <button>Zoom chậm vào cảnh đầu tiên</button>
          <button>Nhạc nền nhỏ đi 4 dB</button>
        </div>
        <form class="aiform" id="aiForm" action="#" onsubmit="return false">
          <label for="aiIn" class="tc" style="font-size:11px">Nhập lệnh dựng</label>
          <textarea id="aiIn" placeholder="Ví dụ: cắt ở giây 5, thêm chuyển cảnh Hoà tan và chữ &quot;Giảm 30%&quot; màu vàng ở phía trên"></textarea>
          <div class="row">
            <select id="aiEffort" aria-label="Mức suy nghĩ"><option value="low">Nhanh</option><option value="medium">Cân bằng</option><option value="high">Kỹ</option></select>
            <div class="spacer"></div>
            <button type="button" id="aiStop" hidden>Dừng</button>
            <button type="submit" class="primary" id="aiSend">Gửi</button>
          </div>
        </form>
      </div>
      <div class="insp" id="insp" role="tabpanel" hidden></div>
    </section>
  </div>

  <div class="split" id="split" role="separator" aria-orientation="horizontal" aria-label="Kéo để đổi chiều cao timeline" tabindex="0"></div>
  <section class="tl" aria-label="Timeline">
    <div class="tlbar">
      <div class="grp">
        <button class="icon" id="addBtn" title="Thêm media, chữ hoặc track"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="icon" id="toolBtn" title="Công cụ: Chọn (V) / Dao cắt (C)"><span id="toolIco"><svg class="i" viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg></span><svg class="i" viewBox="0 0 24 24" style="width:10px"><path d="M6 9l6 6 6-6"/></svg></button>
      </div><span class="sep"></span>
      <div class="grp">
        <button class="icon" id="undoBtn" title="Hoàn tác (Ctrl+Z)"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
        <button class="icon" id="redoBtn" title="Làm lại (Ctrl+Shift+Z)"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      </div><span class="sep"></span>
      <div class="grp">
        <button class="icon" id="splitBtn" title="Tách tại kim (Ctrl+B hoặc S)"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v18M8 7l-4 5 4 5M16 7l4 5-4 5"/></svg></button>
        <button class="icon" id="delLBtn" title="Xoá phần bên trái kim (Q)"><svg class="i" viewBox="0 0 24 24"><path d="M14 3v18M10 7l-4 5 4 5"/><path d="M4 4l6 6M10 4L4 10" opacity=".7"/></svg></button>
        <button class="icon" id="delRBtn" title="Xoá phần bên phải kim (W)"><svg class="i" viewBox="0 0 24 24"><path d="M10 3v18M14 7l4 5-4 5"/><path d="M14 4l6 6M20 4l-6 6" opacity=".7"/></svg></button>
        <button class="icon" id="delBtn" title="Xoá clip (Delete)"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
        <button class="icon" id="markBtn" title="Thêm/bỏ marker tại kim (M)"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v14l-6 4-6-4z"/></svg></button>
      </div><span class="sep"></span>
      <div class="grp">
        <button class="icon" id="freezeBtn" title="Đứng hình: chèn khung đứng 3 giây tại kim"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M10 9v6M14 9v6"/></svg></button>
        <button class="icon" id="revBtn" title="Đảo ngược clip video"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
        <button class="icon" id="flipBtn" title="Lật ngang"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M8 7L3 12l5 5zM16 7l5 5-5 5z"/></svg></button>
        <button class="icon" id="rotBtn" title="Xoay 90°"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
        <button class="icon" id="cropBtn" title="Cắt khung / vị trí / màu (mở Thuộc tính)"><svg class="i" viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg></button>
        <button class="icon" id="dupBtn" title="Nhân bản (D)"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button>
        <button class="icon" id="trimBtn" title="Chọn đoạn trong source (T)"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg></button>
        <button class="icon" id="textBtn" title="Thêm chữ tại kim"><svg class="i" viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
      </div>
      <div class="right">
        <button class="icon" id="recBtn" title="Thu âm giọng nói tại kim"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <span class="sep"></span>
        <button class="icon toggle" id="magBtn" aria-pressed="true" title="Nam châm track chính: các cảnh tự nối liền"><svg class="i" viewBox="0 0 24 24"><path d="M6 3v8a6 6 0 0 0 12 0V3"/><path d="M6 7h4M14 7h4"/></svg></button>
        <button class="icon toggle" id="snapBtn" aria-pressed="true" title="Tự hít vào mép clip, kim và marker"><svg class="i" viewBox="0 0 24 24"><path d="M4 12h6M14 12h6"/><path d="M10 8v8M14 8v8"/></svg></button>
        <button class="icon toggle" id="linkBtn" aria-pressed="true" title="Liên kết: chữ và SFX đi theo cảnh video khi cảnh dịch chuyển"><svg class="i" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></button>
        <button class="icon toggle" id="hovBtn" aria-pressed="false" title="Xem trước khi rê chuột trên timeline"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M12 17v4M8 21h8"/></svg></button>
        <span class="sep"></span>
        <button class="icon" id="zoomOut" title="Thu nhỏ"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-5-5"/></svg></button>
        <div class="zoom"><input type="range" id="zoom" min="6" max="260" value="40" aria-label="Thu phóng timeline"></div>
        <button class="icon" id="zoomIn" title="Phóng to"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M21 21l-5-5"/></svg></button>
        <button class="icon" id="zoomFit" title="Vừa khung"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>
    <div class="scroller" id="scroller"><div class="grid" id="grid"></div></div>
  </section>
  <nav class="mtabs" id="mtabs" aria-label="Bảng điều khiển">
    <button data-sheet="lib"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg><span>Thư viện</span></button>
    <button data-act="import"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Nhập</span></button>
    <button data-act="text"><svg class="i" viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg><span>Chữ</span></button>
    <button data-sheet="insp"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Thuộc tính</span></button>
    <button data-sheet="ai"><span class="dot"></span><span>Trợ lý</span></button>
  </nav>
</div>
<script src="vendor/mp4box.all.min.js"></script>
<script src="vendor/mp4-muxer.js"></script>
<script src="js/core.js"></script>
<script src="js/engine.js"></script>
<script src="js/text.js"></script>
<script src="js/fonts_catalog.js"></script>
<script src="js/fonts.js"></script>
<script src="js/linkdl.js"></script>
<script src="js/audio.js"></script>
<script src="js/media.js"></script>
<script src="js/render.js"></script>
<script src="js/timeline.js"></script>
<script src="js/inspector.js"></script>
<script src="js/motion.js"></script>
<script src="js/lumetri.js"></script>
<script src="js/fxlib.js"></script>
<script src="js/audiofx.js"></script>
<script src="js/ops.js"></script>
<script src="js/interact.js"></script>
<script src="js/export.js"></script>
<script src="js/project.js"></script>
<script src="js/wiring.js"></script>
<script src="js/premiere.js"></script>
<script src="js/ai.js"></script>
<script src="js/assets.js"></script>
<script src="js/aimodels.js"></script>
<script src="js/home.js"></script>
<script src="js/stage.js"></script>
<script src="js/tools.js"></script>
<script src="js/masks.js"></script>
<script src="js/grade.js"></script>
<script src="js/nodegraph.js"></script>
<script src="js/colorgraph.js"></script>
<script src="js/aiflow.js"></script>
<script src="js/workspace.js"></script>
<script src="js/compound.js"></script>
<script src="js/antifact.js"></script>
<script src="js/fixes.js"></script>
<script src="js/pen.js"></script>
<script src="js/input.js"></script>
<script src="js/lyrics.js"></script>
