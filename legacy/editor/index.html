<title>Bravin (bản đầu tiên)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: editor shell — top bar, [media bin | preview | inspector], timeline docked at the bottom. Single dark look by choice (editing suite). */
:root{
  --bg:#0d1417; --panel:#141e22; --panel2:#1a272c; --line:#25363c; --fg:#e6f0f2; --muted:#87a0a7;
  --accent:#0097cc; --accent2:#027fa5; --gold:#e9b949; --danger:#e5604f;
  --vclip:#0f5f7c; --aclip:#1f5a45;
  --ui:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:13px;overflow:hidden}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,.clip:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.primary:hover{background:var(--accent2)}
button.icon{padding:6px 8px}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;padding:0 12px 10px;gap:10px}
.top{display:flex;align-items:center;gap:10px;padding-top:10px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.02em;font-size:15px;display:flex;align-items:center;gap:8px}
.brand b{color:var(--accent)}
.badge{font-size:11px;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:20px;padding:2px 8px;font-weight:600}
.spacer{flex:1}
select{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.main{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:10px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-bottom:1px solid var(--line);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bin{padding:10px;overflow:auto;display:grid;grid-auto-rows:max-content;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start;flex:1}
.drop{grid-column:1/-1;border:1.5px dashed var(--line);border-radius:9px;padding:14px 8px;text-align:center;color:var(--muted);line-height:1.5;cursor:pointer}
.drop.over,.bin.over .drop{border-color:var(--accent);color:var(--fg);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.mitem{position:relative;border-radius:8px;overflow:hidden;background:#000;height:150px;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;border:1px solid var(--line)}
.mitem img{width:100%;height:100%;object-fit:cover;display:block}
.mitem .mname{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;font-size:10.5px;background:linear-gradient(transparent,rgba(0,0,0,.85));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem .mdur{position:absolute;top:5px;right:5px;font:600 10px var(--mono);background:rgba(0,0,0,.65);padding:1px 5px;border-radius:4px}
.mitem .add{position:absolute;top:5px;left:5px;padding:2px 6px;font-size:11px;background:var(--accent);border:0;color:#fff;border-radius:5px}
.mitem.audio{display:flex;align-items:center;justify-content:center;background:var(--aclip)}
.mitem.audio svg{width:34px;height:34px;stroke:#bfe8d6}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0;padding:10px}
.canvaswrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas#pv{background:#000;border-radius:8px;max-width:100%;max-height:100%;box-shadow:0 0 0 1px var(--line)}
.transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.tc{font:600 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.tc b{color:var(--fg);font-weight:600}
.insp{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.insp .empty{color:var(--muted);line-height:1.6}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.field .val{font:600 13px var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=range]{accent-color:var(--accent);width:100%}
.help{font-size:11.5px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:10px}
kbd{font:600 10.5px var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
/* timeline */
.tl{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;height:var(--tlh,42vh);min-height:260px;max-height:75vh}
.split{height:10px;margin:-6px 0 -4px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;touch-action:none}
.split::before{content:"";width:56px;height:4px;border-radius:3px;background:var(--line)}
.split:hover::before,.split.on::before{background:var(--accent)}
.tlbar{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tlbar .zoom{display:flex;align-items:center;gap:6px;margin-left:auto;color:var(--muted);font-size:12px}
.tlbar .zoom input{width:120px}
.toggle[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.tlbody{display:grid;grid-template-columns:64px minmax(0,1fr);flex:1;min-height:0}
.heads{border-right:1px solid var(--line);display:grid;grid-template-rows:28px 3fr 2fr;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.05em}
.heads div{display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
.scroller{overflow-x:auto;overflow-y:hidden;position:relative}
.lane{position:relative;min-width:100%}
.ruler{height:28px;border-bottom:1px solid var(--line);position:relative;cursor:pointer;background:var(--panel2)}
.tick{position:absolute;top:0;height:100%;border-left:1px solid var(--line);font:500 10px var(--mono);color:var(--muted);padding:3px 0 0 4px;pointer-events:none}
.tick.minor{height:30%;top:70%}
.track{position:relative;border-bottom:1px solid var(--line)}
.track.v{height:calc((100% - 28px)*.6)}
.track.a{height:calc((100% - 28px)*.4)}
.track.over{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.clip{position:absolute;top:8px;bottom:8px;border-radius:8px;overflow:hidden;cursor:grab;border:1.5px solid transparent;background-color:var(--vclip);background-repeat:no-repeat;touch-action:none;user-select:none}
.clip.a{background-color:var(--aclip)}
.clip.sel{border-color:var(--gold)}
.clip.dragging{opacity:.55;cursor:grabbing;z-index:5}
.clip .cl{position:absolute;left:16px;top:5px;right:16px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000;pointer-events:none}
.clip .cd{position:absolute;right:16px;bottom:4px;font:600 11px var(--mono);text-shadow:0 1px 2px #000;pointer-events:none}
.clip .mute{position:absolute;left:16px;bottom:3px;font-size:10px;color:var(--gold);pointer-events:none}
.h{position:absolute;top:0;bottom:0;width:14px;cursor:ew-resize;background:rgba(255,255,255,.0);z-index:2}
.h.l{left:0}.h.r{right:0}
.clip.sel .h{background:var(--gold)}
.clip.sel .h::after{content:"";position:absolute;top:50%;left:6px;width:2px;height:20px;margin-top:-10px;background:#1a1405;border-radius:1px}
.insert{position:absolute;top:2px;bottom:2px;width:3px;background:var(--accent);border-radius:2px;pointer-events:none;z-index:6;box-shadow:0 0 8px var(--accent)}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);pointer-events:none;z-index:8}
.playhead::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:9px solid var(--gold)}
.snapline{position:absolute;top:0;bottom:0;width:1px;background:#fff;opacity:.7;pointer-events:none;z-index:7}
.overlay{position:fixed;inset:0;background:rgba(5,10,12,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.dialog h2{margin:0;font-size:16px}
.bar{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:9px 14px;border-radius:9px;z-index:60;max-width:calc(100% - 32px)}

[hidden]{display:none!important}
.dragcard{position:fixed;left:0;top:0;width:76px;height:100px;border-radius:8px;overflow:hidden;border:2px solid var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.6);pointer-events:none;z-index:45;background:var(--aclip) center/cover no-repeat;opacity:.92}
.dragcard span{position:absolute;left:0;right:0;bottom:0;font-size:9.5px;padding:3px 4px;background:rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track.over{background:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.track.no{background:color-mix(in srgb,var(--danger) 10%,transparent)}
/* AI assistant */
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:transparent;padding:4px 8px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-radius:6px}
.tabs button[aria-selected=true]{background:var(--panel2);color:var(--fg)}
.tabs button .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.ai{display:flex;flex-direction:column;min-height:0;flex:1}
.ai[hidden]{display:none!important}
.msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:100%;padding:8px 10px;border-radius:9px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.u{align-self:flex-end;background:var(--accent2);color:#fff;max-width:88%}
.msg.c{background:var(--panel2);border:1px solid var(--line)}
.msg.c.think{color:var(--muted);font-style:italic}
.msg .meta{display:block;font-size:10.5px;color:var(--muted);margin-top:4px;font-style:normal}
.steps{display:flex;flex-direction:column;gap:3px;font:500 11px var(--mono);color:var(--muted);border-left:2px solid var(--accent);padding:2px 0 2px 8px}
.steps .ok{color:#8fd3b4}.steps .err{color:var(--danger)}
.aiform{border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px}
.aiform textarea{resize:none;min-height:58px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--fg);font:inherit;line-height:1.45}
.aiform .row{align-items:center}
.aiform select{padding:4px 6px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 10px 8px}
.chips button{font-size:11px;padding:4px 8px;border-radius:14px}
.ainote{padding:12px;color:var(--muted);line-height:1.6}
#ghost{position:fixed;left:0;top:0;width:26px;height:26px;z-index:40;pointer-events:none;transition:transform .45s cubic-bezier(.3,.7,.2,1);opacity:0}
#ghost.on{opacity:1}
#ghost svg{width:26px;height:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
#ghost .tag{position:absolute;left:22px;top:20px;background:var(--accent);color:#fff;font:700 10px var(--ui);padding:2px 6px;border-radius:5px;white-space:nowrap}
#ghost .ring{position:absolute;left:-9px;top:-9px;width:22px;height:22px;border-radius:50%;border:2px solid var(--gold);opacity:0}
#ghost.click .ring{animation:ring .45s ease-out}
@keyframes ring{from{opacity:1;transform:scale(.4)}to{opacity:0;transform:scale(1.8)}}
body.aibusy .tl,body.aibusy .bin{outline:1px dashed color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:-1px}
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .stage{order:-1}
  canvas#pv{max-height:52vh}
  .bin{grid-template-columns:repeat(3,minmax(0,1fr));max-height:300px}
  .mitem{height:130px}
  .tl{height:var(--tlh,340px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="ghost" aria-hidden="true"><div class="ring"></div><svg viewBox="0 0 24 24"><path d="M4 2l15 9-7 1.6L9 20z" fill="#fff" stroke="#0d1417" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="tag">Claude</span></div>
<div class="app">
  <header class="top">
    <div class="brand"><svg class="i" viewBox="0 0 24 24" style="color:var(--accent)"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg><span>Bravin <b>Cut</b></span></div>
    <span class="badge" id="projBadge">Dự án mẫu</span>
    <div class="spacer"></div>
    <label class="tc" for="aspect">Khung hình</label>
    <select id="aspect">
      <option value="9:16">9:16 · TikTok/Reels</option>
      <option value="16:9">16:9 · YouTube</option>
      <option value="1:1">1:1 · Vuông</option>
    </select>
    <button id="newProj" title="Xoá timeline, bắt đầu dự án trống"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Dự án mới</button>
    <button class="primary" id="exportBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Xuất video</button>
  </header>

  <div class="main">
    <section class="panel" aria-label="Thư viện">
      <div class="ph"><span>Thư viện</span><button class="icon" id="importBtn" title="Nhập file"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <div class="bin" id="bin">
        <div class="drop" id="drop">Thả video, ảnh hoặc nhạc vào đây<br><small>hoặc bấm để chọn file</small></div>
      </div>
      <input type="file" id="file" accept="video/*,audio/*,image/*" multiple hidden>
    </section>

    <section class="stage" aria-label="Xem trước">
      <div class="canvaswrap"><canvas id="pv" width="720" height="1280"></canvas></div>
      <div class="transport">
        <button class="icon" id="toStart" title="Về đầu (Home)"><svg class="i" viewBox="0 0 24 24"><path d="M6 5v14M18 6l-8 6 8 6z"/></svg></button>
        <button class="icon" id="stepBack" title="Lùi 1 khung (←)"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="primary" id="playBtn" title="Phát / dừng (Space)"><svg class="i" viewBox="0 0 24 24" id="playIco"><path d="M7 5l12 7-12 7z"/></svg><span id="playTxt">Phát</span></button>
        <button class="icon" id="stepFwd" title="Tiến 1 khung (→)"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <span class="tc" id="tc"><b>00:00.00</b> / 00:00.00</span>
      </div>
    </section>

    <section class="panel" aria-label="Thuộc tính và trợ lý">
      <div class="ph"><div class="tabs" role="tablist">
        <button role="tab" id="tabAi" aria-selected="true" aria-controls="aiPane"><span class="dot"></span> Trợ lý</button>
        <button role="tab" id="tabInsp" aria-selected="false" aria-controls="insp">Thuộc tính</button>
      </div><span class="tc" style="font-size:10.5px">Opus 5.5</span></div>
      <div class="ai" id="aiPane" role="tabpanel">
        <div class="msgs" id="msgs" aria-live="polite"></div>
        <div class="chips" id="chips">
          <button>Bỏ 1 giây đầu mỗi clip</button>
          <button>Đưa clip Hà Nội lên đầu</button>
          <button>Cắt mỗi clip còn 2,5 giây</button>
          <button>Voice chạy từ giây 1, nhỏ đi 6 dB</button>
        </div>
        <form class="aiform" id="aiForm">
          <label for="aiIn" class="tc" style="font-size:11px">Nhập lệnh dựng</label>
          <textarea id="aiIn" placeholder="Ví dụ: cắt clip thứ 2 tại giây 1,5 rồi xoá nửa sau"></textarea>
          <div class="row">
            <select id="aiEffort" aria-label="Mức suy nghĩ"><option value="low">Nhanh</option><option value="medium">Cân bằng</option><option value="high">Kỹ</option></select>
            <div class="spacer"></div>
            <button type="button" id="aiStop" hidden>Dừng</button>
            <button type="submit" class="primary" id="aiSend">Gửi</button>
          </div>
        </form>
      </div>
      <div class="insp" id="insp" role="tabpanel" hidden></div>
    </section>
  </div>

  <div class="split" id="split" role="separator" aria-orientation="horizontal" aria-label="Kéo để đổi chiều cao timeline" tabindex="0"></div>
  <section class="tl" aria-label="Timeline">
    <div class="tlbar">
      <button id="splitBtn" title="Cắt đôi clip tại kim (S)"><svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/></svg>Cắt</button>
      <button id="delBtn" title="Xoá clip đang chọn (Delete)"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Xoá</button>
      <button id="dupBtn" title="Nhân bản clip (D)"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>Nhân bản</button>
      <button class="icon" id="undoBtn" title="Hoàn tác (Ctrl+Z)"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="icon" id="redoBtn" title="Làm lại (Ctrl+Shift+Z)"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <button class="toggle" id="snapBtn" aria-pressed="true" title="Hít vào mép clip và kim"><svg class="i" viewBox="0 0 24 24"><path d="M6 3v8a6 6 0 0 0 12 0V3M6 7h4M14 7h4"/></svg>Hít</button>
      <div class="zoom"><label for="zoom">Thu phóng</label><input type="range" id="zoom" min="8" max="260" value="90"></div>
    </div>
    <div class="tlbody">
      <div class="heads"><div></div><div title="Track video chính">VIDEO</div><div title="Track âm thanh">ÂM</div></div>
      <div class="scroller" id="scroller">
        <div class="lane" id="lane">
          <div class="ruler" id="ruler"></div>
          <div class="track v" id="vtrack"></div>
          <div class="track a" id="atrack"></div>
          <div class="playhead" id="playhead"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const FPS = 30, MINLEN = 0.2;
const SAMPLES = []; // video mẫu đã gỡ khỏi repo

const media = new Map();   // id -> {id,name,kind,url,duration,thumb,strip,wave,el,img}
let V = [];                // video track: [{id,mediaId,in,out,vol,muted}]
let A = [];                // audio track: [{id,mediaId,start,in,out,vol}]
let sel = null;            // {track:'v'|'a', id}
let t = 0, playing = false, pps = 90, snapOn = true;
let undoStack = [], redoStack = [];
let uid = 1; const nid = p => p + (uid++);

/* ---------- helpers ---------- */
const fmt = s => { s = Math.max(0, s); const m = Math.floor(s / 60), r = s - m * 60; return String(m).padStart(2, "0") + ":" + r.toFixed(2).padStart(5, "0"); };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const len = c => c.out - c.in;
function vStarts() { let acc = 0; return V.map(c => { const s = acc; acc += len(c); return s; }); }

    case "aspect": { const v = String(o.value); if (!["9:16", "16:9", "1:1"].includes(v)) throw new Error("Khung hình phải là 9:16, 16:9 hoặc 1:1"); const s = $("#aspect"); await ghostTo(...center(s)); await ghostClick(); s.value = v; s.onchange({ target: s }); return "Đổi khung hình " + v; }
    default: throw new Error("Không hiểu thao tác: " + kind);
  }
}
function splitAtPlayheadSilent() {
  const tr = sel && sel.track === "a" ? "a" : "v";
  if (tr === "v") { const st = vStarts(); const i = V.findIndex((c, k) => t > st[k] + 0.05 && t < st[k] + len(c) - 0.05); if (i < 0) return; const c = V[i], cut = c.in + (t - st[i]); const b = { ...c, id: nid("v"), in: cut }; c.out = cut; V.splice(i + 1, 0, b); sel = { track: "v", id: b.id }; }
  else { const c = A.find(c => t > c.start + 0.05 && t < c.start + len(c) - 0.05); if (!c) return; const cut = c.in + (t - c.start); const b = { ...c, id: nid("a"), in: cut, start: t }; c.out = cut; A.push(b); sel = { track: "a", id: b.id }; }
  renderTimeline();
}

/* ---------- assistant chat ---------- */
const RULES = `Bạn là trợ lý dựng video nằm bên trong phần mềm "Bravin" (timeline kiểu CapCut). Người dùng nói tiếng Việt.
Phần mềm có:
- Track VIDEO chính: các clip nối liền nhau theo thứ tự (magnetic). Vị trí clip = thứ tự. Thời điểm start/end của clip tự tính lại sau mỗi thao tác.
- Track ÂM: clip đặt tự do theo "start" (giây trên timeline).
- Mỗi clip có in/out là giây bên trong file gốc (0 ≤ in < out ≤ source_max). Độ dài clip = out - in.
Cách làm việc:
1. Đọc TRẠNG THÁI hiện tại được gửi kèm mỗi lệnh. Dùng đúng id clip (vd "v3", "a1") và id file (vd "m2").
2. Gọi tool apply_edits MỘT lần với toàn bộ danh sách thao tác theo thứ tự. Các thao tác chạy lần lượt; id clip mới sinh ra khi cắt/nhân bản/thêm sẽ có trong kết quả trả về. Nếu cần thao tác tiếp trên clip mới, gọi apply_edits thêm một lần nữa.
3. Lưu ý thứ tự: sau khi cắt hoặc xoá, start/end của các clip phía sau thay đổi. Khi cắt nhiều điểm trên track video, cắt từ điểm muộn nhất về sớm nhất để thời điểm không bị lệch.
4. Xong thì trả lời 1-3 câu ngắn bằng tiếng Việt: đã làm gì. Nếu lệnh mơ hồ, chọn cách hợp lý nhất và nói rõ bạn hiểu thế nào. Nếu không làm được (ví dụ yêu cầu thêm chữ, hiệu ứng, màu, xuất file), nói ngắn gọn phần mềm chưa hỗ trợ; nút Xuất video người dùng tự bấm.
Không dùng emoji.`;
const TOOL_DESC = `Áp dụng lần lượt các thao tác chỉnh sửa lên timeline (người dùng nhìn thấy con trỏ thực hiện từng bước; cả lô có thể hoàn tác một lần). Trả về kết quả từng bước và trạng thái mới.
Thao tác hợp lệ (trường "op"):
- split {time, track?:"video"|"audio"}: cắt đôi clip tại giây "time" trên timeline.
- trim {clip, in?, out?, duration?, trim_start?, trim_end?}: đặt điểm vào/ra (giây trong file gốc), hoặc duration (giữ in), hoặc bỏ bớt trim_start giây ở đầu / trim_end giây ở cuối.
- move {clip, to_index}: chuyển clip video tới vị trí (1 = đầu).
- move_audio {clip, start}: đặt clip âm bắt đầu tại giây "start".
- delete {clip} · duplicate {clip}
- volume {clip, db}: -40 (tắt) đến 0. · mute {clip, muted:boolean} (clip video).
- add {media, index?, start?}: thêm file từ thư viện; video/ảnh chèn vào vị trí index (mặc định cuối), âm thanh đặt ở start.
- seek {time} · aspect {value:"9:16"|"16:9"|"1:1"}`;
let aiTurns = [], aiCtl = null, sampleFn = null, aiReady = false;
const msgsEl = $("#msgs");
function addMsg(cls, text) { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; msgsEl.appendChild(d); msgsEl.scrollTop = msgsEl.scrollHeight; return d; }
function aiIntro() {
  addMsg("c", "Chào bạn. Mình là Claude Opus 5.5 trong Bravin. Gõ lệnh dựng bằng tiếng Việt, mình sẽ thao tác ngay trên timeline để bạn xem từng bước. Mọi thay đổi của mình đều hoàn tác được bằng Ctrl+Z.");
}
async function initAI() {
  aiIntro();
  try { sampleFn = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch (e) { sampleFn = null; }
  if (!sampleFn) { aiOff("Trợ lý chỉ chạy khi mở trang này trên claude.ai."); return; }
  let lim = null; try { lim = await sampleFn.limits(); } catch (e) {}
  if (lim && !lim.tools) { aiOff("Ứng dụng Claude bạn đang dùng chưa cho trợ lý thao tác trực tiếp. Hãy mở trang trên claude.ai bằng trình duyệt máy tính."); return; }
  aiReady = true;
}
function aiOff(msg) { aiReady = false; $("#aiSend").disabled = true; $("#aiIn").disabled = true; $("#chips").hidden = true; addMsg("c", msg); }
const errCopy = { not_granted: "Bạn chưa cho phép trang dùng Claude. Mở menu quyền của trang để bật lại.", sampling_disabled: "Tài khoản này chưa dùng được Claude trong trang.", rate_limited: "Đang gửi quá nhiều hoặc đã chạm giới hạn sử dụng. Chờ một lúc rồi thử lại.", session_expired: "Phiên đăng nhập hết hạn. Đăng nhập lại claude.ai rồi thử lại.", prompt_too_large: "Dự án quá lớn để gửi. Thử lệnh ngắn hơn.", refused: "Claude từ chối lệnh này. Thử diễn đạt khác.", empty_completion: "Claude không trả lời. Thử lệnh đơn giản hơn.", tools_unavailable: "Ứng dụng này chưa cho trợ lý thao tác trực tiếp." };
async function askAI(text) {
  if (!aiReady || !text.trim()) return;
  if (playing) pause();
  addMsg("u", text);
  const bubble = addMsg("c think", "Đang suy nghĩ…"); let stepsBox = null;
  const ensureSteps = () => { if (!stepsBox) { stepsBox = document.createElement("div"); stepsBox.className = "steps"; msgsEl.insertBefore(stepsBox, bubble); } return stepsBox; };
  aiCtl = new AbortController(); $("#aiSend").hidden = true; $("#aiStop").hidden = false; document.body.classList.add("aibusy");
  const state = JSON.stringify(describeState());
  const turns = [{ role: "user", content: RULES }, ...aiTurns.slice(-8), { role: "user", content: `TRẠNG THÁI HIỆN TẠI:\n${state}\n\nLỆNH: ${text}` }];
  let pushed = false;
  const tools = [
    { name: "apply_edits", description: TOOL_DESC,
      inputSchema: { type: "object", properties: { ops: { type: "array", description: "Danh sách thao tác theo thứ tự", items: { type: "object", properties: { op: { type: "string" } }, required: ["op"] } } }, required: ["ops"] },
      async execute(input, ctx) {
        const ops = Array.isArray(input.ops) ? input.ops.slice(0, 40) : [];
        if (!pushed) { pushUndo(); pushed = true; }
        const results = []; const box = ensureSteps();
        for (const op of ops) {
          if (ctx.signal.aborted) { results.push({ op: op && op.op, ok: false, error: "Đã dừng" }); break; }
          const line = document.createElement("div"); line.textContent = "… " + (op && op.op); box.appendChild(line); msgsEl.scrollTop = msgsEl.scrollHeight;
          try { const msg = await runOp(op); line.textContent = "✓ " + msg; line.className = "ok"; results.push({ op: op.op, ok: true, done: msg }); }
          catch (e) { line.textContent = "✗ " + (e && e.message || e); line.className = "err"; results.push({ op: op && op.op, ok: false, error: String(e && e.message || e) }); }
          await sleep(120 * ghostSpeed);
        }
        ghostHide(); renderAll();
        return { results, state: describeState() };
      } },
    { name: "get_timeline", description: "Trả về trạng thái timeline hiện tại (clip, thời điểm, thư viện). Chỉ dùng khi cần kiểm tra lại.", execute() { return describeState(); } }
  ];
  const opts = { signal: aiCtl.signal, tools, model: "claude-opus-5-5", modelTier: "complex", effort: $("#aiEffort").value,
    onText: ({ text: tx }) => { bubble.classList.remove("think"); bubble.textContent = tx; msgsEl.scrollTop = msgsEl.scrollHeight; } };
  try {
    const res = await sampleFn(turns, opts);
    bubble.classList.remove("think"); bubble.textContent = res.text;
    const meta = document.createElement("span"); meta.className = "meta";
    meta.textContent = res.modelApplied ? "Claude Opus 5.5" : ("Opus 5.5 chưa sẵn cho tài khoản này, đã chạy bằng model mức " + (res.modelTierApplied || "khác"));
    if (res.truncated) meta.textContent += " · trả lời bị cắt ngắn";
    bubble.appendChild(meta);
    aiTurns.push({ role: "user", content: "LỆNH: " + text }, { role: "assistant", content: res.text });
  } catch (e) {
    const code = e && e.code;
    if (code === "cancelled") { bubble.classList.remove("think"); bubble.textContent = (e.text ? e.text + "\n" : "") + "Đã dừng. Những bước đã làm vẫn giữ, bấm Ctrl+Z để hoàn tác."; }
    else if (code === "not_granted" || code === "sampling_disabled" || code === "tools_unavailable") { bubble.remove(); aiOff(errCopy[code]); }
    else { bubble.classList.remove("think"); bubble.textContent = (e && e.text ? e.text + "\n\n" : "") + (errCopy[code] || "Kết nối gián đoạn. Bấm Gửi để thử lại."); }
  } finally {
    ghostHide(); document.body.classList.remove("aibusy"); $("#aiSend").hidden = false; $("#aiStop").hidden = true; aiCtl = null; syncButtons();
  }
}
$("#aiForm").addEventListener("submit", e => { e.preventDefault(); const v = $("#aiIn").value; $("#aiIn").value = ""; askAI(v); });
$("#aiIn").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#aiForm").requestSubmit(); } });
$("#aiStop").onclick = () => aiCtl && aiCtl.abort();
$("#chips").querySelectorAll("button").forEach(b => b.onclick = () => askAI(b.textContent));
if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) ghostSpeed = 0.2;
initAI();

(async function boot() {
  renderAll();
  const ms = [];
  for (const s of SAMPLES) {
    try { const r = await fetch(s.file); if (!r.ok) throw 0; const b = await r.blob(); const m = await addMedia(new File([b], s.file, { type: s.file.endsWith(".mp3") ? "audio/mpeg" : "video/mp4" }), s.name); ms.push(m); }
    catch (e) { ms.push(null); }
  }
  const vids = ms.filter(m => m && m.kind === "video"), aud = ms.find(m => m && m.kind === "audio");
  vids.forEach((m, i) => V.push({ id: nid("v"), mediaId: m.id, in: 0.3, out: Math.min(m.duration, i % 2 ? 3.2 : 3.6), vol: 0, muted: false }));
  if (aud) A.push({ id: nid("a"), mediaId: aud.id, start: 0, in: 0, out: Math.min(aud.duration, vTotal()), vol: 0 });
  undoStack = []; redoStack = []; renderAll();
})();
</script>
